services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slotbook
      POSTGRES_PASSWORD: slotbook
      POSTGRES_DB: slotbook
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the slotbook_test database for pytest (only on first start of a fresh volume;
      # on an existing volume run: docker compose exec db createdb -U slotbook slotbook_test)
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotbook -d slotbook"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections before migrating
    ports: ["8000:8000"]
    volumes: ["./backend:/code"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
